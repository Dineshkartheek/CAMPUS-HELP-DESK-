# ============================================================
# CampusCare backend configuration
# All secrets are read from environment variables.
# Copy backend/.env.example values into your run configuration.
# ============================================================
spring.application.name=campuscare
server.port=${PORT:8080}

# ---------- MySQL (production / normal run) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helpdesk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates tables. The official MySQL script is database/schema.sql.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------- JWT ----------
# JWT_SECRET must be a long random value (at least 32 characters) in production.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
# Comma-separated list. Example: https://my-app.vercel.app,http://localhost:5173
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:3000}

# ---------- Optional Gemini AI ----------
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.enabled=${GEMINI_ENABLED:true}

# ---------- Bootstrap MAIN_ADMIN (optional) ----------
# No default password is stored in this project. Set these variables once,
# start the application, then remove MAIN_ADMIN_PASSWORD from your environment.
app.main-admin.email=${MAIN_ADMIN_EMAIL:}
app.main-admin.password=${MAIN_ADMIN_PASSWORD:}
app.main-admin.name=${MAIN_ADMIN_NAME:CampusCare Main Administrator}

# ---------- Misc ----------
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-stacktrace=never
